name: Daily Swing Trade Screen

on:
  schedule:
    - cron: '0 11 * * 1-5'   # 11:00 UTC = 4:30 PM IST, Mon-Fri (after NSE close)
  workflow_dispatch:          # lets you click "Run workflow" manually any time

permissions:
  contents: write             # needed so the job can commit results back to the repo

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run screener
        run: python swing_trade_screener.py --out latest_screen.csv

      - name: Commit results back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest_screen.csv
          git commit -m "Update screen results $(date -u +'%Y-%m-%d')" || echo "No changes to commit"
          git push
