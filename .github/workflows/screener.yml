name: Daily Swing Trade Screen

on:
  schedule:
    - cron: '30 3 * * 1-5'   # 03:30 UTC = 9:00 AM IST, Mon-Fri (before NSE pre-open)
    - cron: '30 9 * * 1-5'   # TEMPORARY TEST - 09:30 UTC = 3:00 PM IST - remove this line once confirmed working
  workflow_dispatch:          # lets you click "Run workflow" manually any time

concurrency:
  group: screener-run
  cancel-in-progress: false   # if one run is already going, queue the next instead of racing it

permissions:
  contents: write             # needed so the job can commit results back to the repo

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run screener
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python swing_trade_screener.py --out latest_screen.csv

      - name: Commit results back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest_screen.csv index.html
          git commit -m "Update screen results $(date -u +'%Y-%m-%d')" || echo "No changes to commit"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "Push rejected (attempt $i) - pulling latest and retrying..."
            git pull --rebase origin main
            sleep 3
          done
          echo "Still failing after 5 attempts - see log above."
          exit 1
